<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corse - TaxiPilot</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#e87517">
  
</head>


<body>



<header class="topbar">

<div>

<h1>
Corse
</h1>

<p>
Gestione clienti e trasferimenti
</p>

</div>


</header>







<main class="container">



<section class="dashboard-card">


<h2>
Nuova corsa
</h2>



<input 
id="nomeCliente"
placeholder="Nome cliente">



<input 
id="telefono"
placeholder="Telefono cliente"
type="tel">



<input 
id="partenza"
placeholder="Indirizzo partenza">



<input 
id="destinazione"
placeholder="Destinazione">

<label for="dataCorsa">
Data corsa
</label>

<input
id="dataCorsa"
type="date">

<label for="orario">
Orario corsa
</label>

<input 
id="orario"
type="time">



<input 
id="importo"
placeholder="Importo €"
type="number">





<button

class="main-button"

onclick="salvaCorsa()"

>

Salva corsa

</button>


</section>









<section class="dashboard-card">


<h2>
Le mie corse
</h2>


<input

id="cercaCorsa"

placeholder="Cerca cliente o destinazione"

oninput="cercaCorse()"

>


<div class="switch-corse">


<button 
class="main-button"
onclick="cambiaGiornoCorse('oggi')">

Oggi

</button>


<button 
class="main-button"
onclick="cambiaGiornoCorse('domani')">

Domani

</button>


<button 
class="main-button"
onclick="cambiaGiornoCorse('tutte')">

Tutte

</button>


</div>



<div id="listaCorse">


<p class="empty">

Nessuna corsa inserita

</p>


</div>


</section>



</main>







<nav class="bottom-nav">


<a href="index.html">

Home

</a>



<a class="active" href="corse.html">

Corse

</a>



<a href="turno.html">

Turno

</a>



<a href="sos.html">

SOS

</a>



<a href="profilo.html">

Profilo

</a>



</nav>





<script src="script.js"></script>


</body>

</html>
