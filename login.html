<!DOCTYPE html>
<html lang="it">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Accesso - TaxiPilot</title>


<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#e87517">

</head>



<body class="login-page">






<main class="login-container">





<section class="login-card">



<h1>
TaxiPilot
</h1>



<p class="login-subtitle">

Configurazione dispositivo tassista

</p>







<input

id="loginNome"

placeholder="Nome tassista"

>





<input

id="loginTaxi"

placeholder="Numero taxi"

>







<h2>

Contatti SOS

</h2>




<p>

Aggiungi i numeri che riceveranno gli allarmi.

</p>





<button

class="main-button"

onclick="aggiungiContattoLogin()"

>

Aggiungi contatto

</button>







<div id="loginContatti">



<p class="empty">

Nessun contatto aggiunto

</p>



</div>







<button

class="main-button"

onclick="salvaAccesso()"

>

Completa configurazione

</button>





</section>





</main>








<script src="script.js"></script>


</body>


</html>
