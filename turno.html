<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turno - TaxiPilot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>



<header class="topbar">


<div>

<h1>
Turno
</h1>


<p>
Gestione servizio giornaliero
</p>


</div>


</header>







<main class="container">





<section class="dashboard-card">


<h2>
Avvia turno
</h2>



<input

id="kmInizio"

type="number"

placeholder="Chilometri iniziali"


>



<button

class="main-button"

onclick="iniziaTurno()"

>

Inizia turno

</button>



</section>








<section class="dashboard-card">


<h2>
Stato turno
</h2>



<div id="statoTurno">


<p class="empty">

Nessun turno attivo

</p>


</div>



<button

class="main-button"

onclick="terminaTurno()"

>

Termina turno

</button>



</section>







<section class="dashboard-card">


<h2>
Stato servizio
</h2>



<div class="status"

id="statoServizio">

Disponibile

</div>




<button

class="main-button"

onclick="cambiaStatoServizio()"

>

Cambia stato

</button>



</section>





</main>
