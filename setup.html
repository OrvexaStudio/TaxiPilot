<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaxiPilot Configurazione</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main>


<section class="welcome">

<h1>
Benvenuto in
<span>TaxiPilot</span>
</h1>

<p>
Configura il tuo profilo prima di iniziare.
</p>

</section>




<section class="card">


<h2>
Dati tassista
</h2>


<label>
Nome tassista
</label>


<input id="setupNome"
placeholder="Nome e cognome">



</section>





<section class="card">


<h2>
Contatti sicurezza</h2>


<div id="contatti">


</div>



<button 
class="main-button"
onclick="aggiungiContatto()">

Aggiungi contatto

</button>



</section>





<button
class="main-button"
onclick="completaSetup()">

Inizia a usare TaxiPilot

</button>



</main>





<script src="script.js"></script>


</body>

</html>
